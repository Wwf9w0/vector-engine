spring:
  application:
    name: vektor-engine
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/vektor_engine
    username: neural
    password: recall
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: vektor-engine-pool

  sql:
    init:
      mode: never


ollama:
  base-url: http://localhost:11434
  model: nomic-embed-text:latest
  embedding-dimensions: 768
  timeout-seconds: 30
  retry:
    max-attempts: 3
    initial-delay-ms: 1000
    multiplier: 2.0

ai:
  mode: real

search:
  default-limit: 10
  max-limit: 100
  min-similarity-threshold: 0.5


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /documentation

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    root: INFO
    com.neuralrecall: DEBUG
    org.springframework.retry: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%15.15thread] %cyan(%-40.40logger{39}) : %msg%n"

server:
  port: 8085
  servlet:
    context-path: /api
  shutdown: graceful
